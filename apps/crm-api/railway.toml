[build]
builder = "nixpacks"
buildCommand = "cd ../.. && pnpm install && pnpm --filter @xeno/shared build && pnpm --filter @xeno/crm-api build && pnpm --filter @xeno/crm-api db:generate"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
